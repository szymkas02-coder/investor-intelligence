name: Daily Pipeline

on:
  schedule:
    - cron: "0 5 * * 1-5"  # Mon–Fri 05:00 UTC = 07:00 Warsaw
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pipeline
        run: |
          # wait=true runs the pipeline synchronously so it fully completes
          # instead of being killed when the platform reaps the container after
          # the immediate 200 (that partial-run bug left KM/vol/FX steps stale).
          # --max-time must therefore cover the whole run, not just the trigger.
          # First curl can spend up to ~90s waking a cold free-tier container.
          curl -s -o response.json -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_APP_URL }}/api/pipeline/run?wait=true" \
            -H "Authorization: Bearer ${{ secrets.PIPELINE_SECRET }}" \
            -H "Content-Type: application/json" \
            --connect-timeout 90 --max-time 1200 > http_code.txt
          HTTP_CODE=$(cat http_code.txt)
          echo "HTTP status: $HTTP_CODE"
          cat response.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Pipeline trigger failed with status $HTTP_CODE"
            exit 1
          fi
