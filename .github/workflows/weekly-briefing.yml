name: Weekly AI Briefing

on:
  schedule:
    - cron: "0 19 * * 0"  # Sunday 19:00 UTC = 21:00 Warsaw
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekly briefing
        run: |
          curl -s -o response.json -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_APP_URL }}/api/situation/refresh-scheduled" \
            -H "Authorization: Bearer ${{ secrets.PIPELINE_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 90 > http_code.txt
          HTTP_CODE=$(cat http_code.txt)
          echo "HTTP status: $HTTP_CODE"
          cat response.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Briefing trigger failed with status $HTTP_CODE"
            exit 1
          fi
